name: Deploy Supabase Changes to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v3

      # Pinned so a new CLI release can't break CI or the deploy on its own;
      # move up deliberately, with supabase in package.json.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - run: supabase link --project-ref $SUPABASE_PROJECT_ID
      # From v3, commands target the local stack unless given --remote, and
      # hosted changes need --yes when there is no prompt.
      - run: supabase db push --remote --yes
      - run: supabase functions deploy --remote --yes
