name: Deploy Supabase Changes to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v3

      # Pinned: move up deliberately, not when a release lands.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      # Since CLI v3, commands target the local stack unless given --remote,
      # and every change to the hosted project needs --yes to run unattended.
      - run: supabase link "$SUPABASE_PROJECT_ID"
      - run: supabase db push --remote --yes
      - run: supabase functions deploy --yes
