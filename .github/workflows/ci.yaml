name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # The long-lived redesign branch deploys to its own Cloudflare Pages
      # branch address (Preview settings), which the beta subdomain points at.
      - redesign
  workflow_dispatch:

# A newer push to a PR cancels its older run; runs on main and redesign
# always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Unit tests and lint run here rather than in the Cloudflare Pages build,
  # which has one concurrent runner and queues up PR stacks.
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    # The Supabase client throws at import without these; tests never
    # contact the server, so placeholders are enough.
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Check formatting
        run: npm run format:check

  test:
    name: Supabase Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # Pinned: move up deliberately, not when a release lands.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Start Supabase local development setup
        run: supabase db start

      - name: Test database behavior and permissions
        run: supabase test db

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify generated world defaults are checked in
        run: |
          node scripts/generate-world-defaults.mjs
          git diff --exit-code -- supabase/world-defaults.json supabase/world-defaults.md

      - name: Verify generated types are checked in
        run: |
          supabase gen types typescript > types.gen.ts
          if ! git diff --ignore-space-at-eol --exit-code --quiet types.gen.ts; then
            echo "Detected uncommitted changes after build. See status below:"
            git diff
            exit 1
          fi

  # Builds and uploads to Cloudflare Pages only once every check above has
  # passed, in place of Cloudflare's own Git builds (turned off under Branch
  # control in its dashboard). PRs from forks have no secrets, so they get no
  # preview.
  deploy:
    name: Deploy
    needs: [unit, lint, test]
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Build settings live in two GitHub environments, matching Cloudflare's
    # Production and Preview settings.
    environment: ${{ (github.event_name == 'pull_request' || github.ref_name != 'main') && 'preview' || 'production' }}

    permissions:
      contents: read

    env:
      CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'iron-link' }}
      DEPLOY_BRANCH: ${{ github.head_ref || github.ref_name }}
      DEPLOY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      # The branch's own commit, as Cloudflare built it, not the PR's merge
      # commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # scripts/build-cloudflare.sh and vite.config.ts read the variables
      # Cloudflare's builder set, so they are given the same names here.
      - name: Build
        env:
          CF_PAGES_BRANCH: ${{ env.DEPLOY_BRANCH }}
          CF_PAGES_COMMIT_SHA: ${{ env.DEPLOY_SHA }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_HOST: ${{ vars.POSTHOG_CLI_HOST }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
        # An unset GitHub variable arrives as an empty string, which the
        # PostHog CLI rejects as an invalid host instead of using its default.
        run: |
          if [ -z "${POSTHOG_CLI_HOST:-}" ]; then unset POSTHOG_CLI_HOST; fi
          npm run build:cloudflare

      # PR previews also carry the component library's Storybook under
      # /storybook/, so changes to it can be looked at in a browser before
      # review. Production builds leave it out.
      - name: Build Storybook
        if: github.event_name == 'pull_request'
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npx storybook build --quiet --output-dir dist/storybook

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # Cloudflare's GitHub app comments the preview links on the PR.
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch "$DEPLOY_BRANCH" \
            --commit-hash "$DEPLOY_SHA"
