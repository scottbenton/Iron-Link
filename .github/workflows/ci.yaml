name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # The long-lived redesign branch deploys to its own Cloudflare Pages
      # branch address (Preview settings), which the beta subdomain points at.
      - redesign
  workflow_dispatch:

# A newer push to a PR cancels its older run; runs on main and redesign
# always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Unit tests and lint run here rather than in the Cloudflare Pages build,
  # which has one concurrent runner and queues up PR stacks.
  # Two shards run side by side to halve the wait. Vitest splits by test
  # file, not by run time, so the halves can drift apart as files are added.
  unit:
    name: Unit Tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    # The Supabase client throws at import without these; tests never
    # contact the server, so placeholders are enough.
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test -- --shard=${{ matrix.shard }}/2

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Check formatting
        run: npm run format:check

  test:
    name: Supabase Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # Pinned: move up deliberately, not when a release lands.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Start Supabase local development setup
        run: supabase db start

      - name: Test database behavior and permissions
        run: supabase test db

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify generated world defaults are checked in
        run: |
          node scripts/generate-world-defaults.mjs
          git diff --exit-code -- supabase/world-defaults.json supabase/world-defaults.md

      - name: Verify generated types are checked in
        run: |
          supabase gen types typescript > types.gen.ts
          if ! git diff --ignore-space-at-eol --exit-code --quiet types.gen.ts; then
            echo "Detected uncommitted changes after build. See status below:"
            git diff
            exit 1
          fi

  # PR previews wait only for lint and the database tests, so a preview is up
  # while the unit tests still run; the PR's checks still show their result.
  # PRs from forks have no secrets, so they get no preview.
  preview:
    name: Preview
    needs: [lint, test]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/deploy.yaml
    secrets: inherit

  # Pushes to main and redesign deploy only once every check has passed.
  deploy:
    name: Deploy
    needs: [unit, lint, test]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy.yaml
    secrets: inherit
