name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local development setup
        run: supabase db start

      - name: Test database behavior and permissions
        run: supabase test db

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify generated world defaults are checked in
        run: |
          node scripts/generate-world-defaults.mjs
          git diff --exit-code -- supabase/world-defaults.json supabase/world-defaults.md

      - name: Verify generated types are checked in
        run: |
          supabase gen types typescript --local > types.gen.ts
          if ! git diff --ignore-space-at-eol --exit-code --quiet types.gen.ts; then
            echo "Detected uncommitted changes after build. See status below:"
            git diff
            exit 1
          fi
